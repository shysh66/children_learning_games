name: Security & Quality Check

on: [push, pull_request]

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Fix Safe Vulnerabilities
        run: npm audit fix || true

      - name: Check Production Vulnerabilities
        # Fails the build if high/critical issues exist in production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Full Audit (Informational)
        # Reports all vulnerabilities including dev dependencies, but does not fail the build
        continue-on-error: true
        run: npm audit --audit-level=high
